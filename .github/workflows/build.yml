name: Build dist

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'build dist')"
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependências
        working-directory: lovable-project-130ea37c
        run: bun install

      - name: Gerar build
        working-directory: lovable-project-130ea37c
        run: bun run build

      - name: Salvar pasta dist no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lovable-project-130ea37c/dist -f
          git diff --cached --quiet || git commit -m "build dist"
          git push
